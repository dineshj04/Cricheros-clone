<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CricMates</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        /* Animated Glowing Orbs Background */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 255, 204, 0.4);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(255, 0, 255, 0.3);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 50px) scale(1.2);
            }
        }

        .splash-card {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 2px solid #00ffcc;
            border-radius: 24px;
            padding: 60px 50px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 255, 204, 0.1);
            animation: cardEntrance 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.5));
            animation: pulseIcon 2s infinite alternate;
        }

        @keyframes pulseIcon {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        .brand-title {
            font-size: 42px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(90deg, #fff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a0a0b0;
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Futuristic Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff00ff, #00ffcc);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            animation: fillProgress 2.8s ease-in-out forwards;
        }

        @keyframes fillProgress {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        .welcome-footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <!-- Animated Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="splash-card">
        <div class="logo-container">
            <img src="cricmates_logo.png" alt="CricMates Logo" width="48" height="48" style="object-fit: contain; border-radius: 50%; mix-blend-mode: screen;">
            <h1 class="brand-title">CricMates</h1>
        </div>
        <p class="subtitle">Initializing your grassroots experience...</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <footer class="welcome-footer">
        <p>Â© CricMates Pvt Ltd. All rights reserved.</p>
    </footer>

    <script>
        setTimeout(() => {
            window.location.href = "cricmates.html";
        }, 3000);
    </script>
</body>

</html>
