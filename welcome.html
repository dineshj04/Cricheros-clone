<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CricMates</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 12, 16, 0.85), rgba(10, 12, 16, 0.95)),
                        url('https://img.freepik.com/free-photo/portrait-person-playing-cricket-sport_23-2151702096.jpg') no-repeat center center;
            background-size: cover; 
            z-index: -2;
            animation: zoomBg 20s ease-in-out infinite alternate;
        }

        @keyframes zoomBg {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .box {
            max-width: 400px;
            width: 90%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 0;
        }

        /* Premium Loader */
        .loader-container {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .loader-ring {
            width: 100%;
            height: 100%;
            border: 4px dashed rgba(255, 255, 255, 0.05);
            border-top: 4px solid var(--accent-teal);
            border-bottom: 4px solid var(--accent-teal);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            filter: drop-shadow(0 0 10px var(--accent-teal-glow));
        }

        .loader-inner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid transparent;
            border-left: 3px solid var(--accent-red);
            border-right: 3px solid var(--accent-red);
            border-radius: 50%;
            animation: spinReverse 1s linear infinite;
            filter: drop-shadow(0 0 8px var(--accent-red-glow));
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>
    
    <div class="box glass-card">
        <h1>🏏 Welcome to CricMates</h1>
        <p>Loading your grassroots experience...</p>
        <div class="loader-container">
            <div class="loader-ring"></div>
            <div class="loader-inner"></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "cricmates.html";
        }, 3000);
    </script>
</body>
</html>
