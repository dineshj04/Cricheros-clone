<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - CricMates</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 12, 16, 0.85), rgba(10, 12, 16, 0.95)),
                        url('https://img.freepik.com/free-photo/portrait-person-playing-cricket-sport_23-2151702096.jpg') no-repeat center center;
            background-size: cover; 
            z-index: -2;
            animation: zoomBg 20s ease-in-out infinite alternate;
        }

        @keyframes zoomBg {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .otp-card {
            max-width: 400px;
            width: 90%;
            padding: 50px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .otp-card h2 {
            font-size: 28px;
            color: var(--text-primary);
            text-transform: uppercase;
            font-family: var(--font-header);
        }

        .otp-card h2 span {
            color: var(--accent-teal);
        }

        .otp-card p.intro {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: -15px;
            line-height: 1.5;
        }

        #otpSection {
            display: none;
            animation: fadeIn 0.4s forwards;
        }

        #message {
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            padding: 10px;
            border-radius: var(--radius-sm);
            display: none;
        }

        #message.success {
            display: block;
            background: rgba(0, 245, 196, 0.1);
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
        }

        #message.error {
            display: block;
            background: rgba(255, 59, 92, 0.1);
            color: var(--accent-red-hover);
            border: 1px solid var(--accent-red);
        }

        #message.info {
            display: block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
        }

        .back-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent-teal);
        }
    </style>
</head>
<body>

    <div class="otp-card glass-card">
        <h2>OTP <span>Sign In</span></h2>
        <p class="intro">Enter your mobile number. We will send a secure verification code to sign in.</p>

        <!-- Step 1: Mobile Input -->
        <div id="mobileSection">
            <div class="form-group">
                <label class="form-label">Mobile Number *</label>
                <input type="tel" id="mobile" class="form-input" placeholder="Enter 10-digit number" maxlength="10">
            </div>
            <button class="btn-teal" style="width:100%;" onclick="sendOTP()">Send OTP Code</button>
        </div>

        <!-- Step 2: OTP Input (Hidden Initially) -->
        <div id="otpSection">
            <div class="form-group">
                <label class="form-label">Verification Code (OTP) *</label>
                <input type="text" id="otpInput" class="form-input" placeholder="Enter 4-digit code" maxlength="4" style="text-align: center; letter-spacing: 5px; font-weight: 700;">
            </div>
            <button class="btn-teal" style="width:100%; margin-bottom: 15px;" onclick="verifyOTP()">Verify & Continue &rarr;</button>
        </div>

        <!-- Alert messages -->
        <div id="message"></div>

        <a href="signin.html" class="back-link">&larr; Back to login selection</a>
    </div>

    <!-- Scripts -->
    <script>
        let generatedOTP = "";

        // Send OTP Simulation
        function sendOTP() {
            const mobile = document.getElementById("mobile").value.trim();
            const msgEl = document.getElementById("message");

            // Validation
            if (mobile.length !== 10 || isNaN(mobile)) {
                msgEl.className = "error";
                msgEl.innerText = "Please enter a valid 10-digit mobile number.";
                return;
            }

            // Generate 4-digit OTP
            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();

            // Display code for test simulation
            msgEl.className = "info";
            msgEl.innerHTML = "Mock OTP Sent! Code is: <b style='font-size:16px;'>" + generatedOTP + "</b>";

            // Reveal OTP Verification form
            document.getElementById("mobileSection").style.display = "none";
            document.getElementById("otpSection").style.display = "block";
            document.getElementById("otpInput").focus();
        }

        // Verify OTP Simulation
        function verifyOTP() {
            const userOTP = document.getElementById("otpInput").value.trim();
            const msgEl = document.getElementById("message");

            if (!userOTP) {
                msgEl.className = "error";
                msgEl.innerText = "Please enter the verification code.";
                return;
            }

            if (userOTP === generatedOTP) {
                msgEl.className = "success";
                msgEl.innerText = "âœ“ OTP Verified successfully! Redirecting...";

                // Save simulation sign-in state
                localStorage.setItem("userSignedIn", "true");

                // Redirect to new Home dashboard
                setTimeout(() => {
                    window.location.href = "cricmates.html";
                }, 2000);

            } else {
                msgEl.className = "error";
                msgEl.innerText = "âŒ Incorrect verification code. Please try again.";
            }
        }

        // Reset inputs on focus
        document.querySelectorAll(".form-input").forEach(input => {
            input.addEventListener("focus", () => {
                input.style.borderColor = "var(--accent-teal)";
            });
            input.addEventListener("blur", () => {
                input.style.borderColor = "var(--border-color)";
            });
        });
    </script>
</body>
</html>
